# bootc-image-builder config for the installer ISO.
# No users or passwords are baked in: the installer asks for Dad's name and password.

[customizations.installer.kickstart]
contents = """
%post
# Point the installed system at the registry copy of the image so it keeps getting updates.
# Replace IMAGE_REF before building (see README). Leave this line out if you have no registry yet.
bootc switch --mutate-in-place --transport registry IMAGE_REF
%end
"""

[customizations.installer.modules]
enable = [
    "org.fedoraproject.Anaconda.Modules.Localization",
    "org.fedoraproject.Anaconda.Modules.Timezone",
    "org.fedoraproject.Anaconda.Modules.Users",
]
