name: build-image
on:
  schedule:
    - cron: "30 6 * * *"   # nightly, after uBlue publishes new base images
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dad-silverblue

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Build
        run: |
          podman build --pull=newer \
            --build-arg BASE_IMAGE=ghcr.io/ublue-os/silverblue-main:latest \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y%m%d)" .

      - name: Push
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:latest" "$IMAGE_LC:latest"
          podman push "$IMAGE:$(date -u +%Y%m%d)" "$IMAGE_LC:$(date -u +%Y%m%d)"
